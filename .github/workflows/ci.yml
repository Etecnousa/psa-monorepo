name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: psa_test
          POSTGRES_PASSWORD: psa_test_password
          POSTGRES_DB: psa_test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint Code
        run: pnpm lint

      - name: Type Check
        run: pnpm turbo run type-check

      - name: Generate Prisma Client
        run: pnpm --filter @psa/api exec prisma generate

      - name: Run Tests
        run: pnpm test
        env:
          CI: true
          DATABASE_URL: postgresql://psa_test:psa_test_password@localhost:5432/psa_test_db

      - name: Build Applications
        run: pnpm build
