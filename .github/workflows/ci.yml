name: PSA CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ============================================
  # JOB 1: Verificación de código
  # ============================================
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Instalar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Generar cliente Prisma
        run: pnpm --filter @psa/api prisma:generate
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"

      - name: Build del backend (NestJS)
        run: pnpm --filter @psa/api build

      - name: Build del frontend (Next.js)
        run: pnpm --filter @psa/web build

      - name: Tests unitarios (Vitest)
        run: pnpm --filter @psa/api test
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
          JWT_SECRET: "test-secret-for-ci-only"

  # ============================================
  # JOB 2: Análisis de seguridad
  # ============================================
  security-scan:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Instalar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Auditoría de dependencias
        run: pnpm audit --audit-level=high || true
        continue-on-error: true

      - name: Resumen de seguridad
        run: |
          echo "## 🔒 Reporte de Seguridad" >> $GITHUB_STEP_SUMMARY
          echo "Análisis de vulnerabilidades completado." >> $GITHUB_STEP_SUMMARY
          pnpm audit --json > audit-report.json || true
          echo "Revisar audit-report.json para detalles." >> $GITHUB_STEP_SUMMARY